name: Deploy with Helm

on:
  workflow_call:
    inputs:
      app_name:
        description: "Helm release name"
        required: true
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: true
        type: string
      chart:
        description: "Helm chart to use"
        required: false
        type: string
        default: vmedias/nextjs-app
      chart_version:
        description: "Helm chart version"
        required: false
        type: string
        default: ""
      values_file:
        description: "Path to values file"
        required: false
        type: string
        default: k8s/values-staging.yaml
      image_tag:
        description: "Image tag to deploy"
        required: true
        type: string
    secrets:
      KUBECONFIG:
        description: "Base64-encoded kubeconfig for the target cluster"
        required: true

jobs:
  deploy:
    name: Helm deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy
        run: |
          helm repo add vmedias https://vmedias.github.io/helm-charts
          helm repo update
          helm upgrade --install ${{ inputs.app_name }} ${{ inputs.chart }} \
            --namespace ${{ inputs.namespace }} \
            --create-namespace \
            -f ${{ inputs.values_file }} \
            --set image.tag=${{ inputs.image_tag }} \
            ${{ inputs.chart_version != '' && format('--version {0}', inputs.chart_version) || '' }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ inputs.app_name }} \
            -n ${{ inputs.namespace }} --timeout=120s